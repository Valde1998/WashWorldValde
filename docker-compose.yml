services:
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: cleanwash
      JWT_SECRET_KEY: washworld-local-secret
      CORS_ORIGINS: http://localhost:3000
      FLASK_DEBUG: "false"
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      EMAIL_VERIFICATION_TTL_MINUTES: ${EMAIL_VERIFICATION_TTL_MINUTES:-15}
      EMAIL_VERIFICATION_RESEND_SECONDS: ${EMAIL_VERIFICATION_RESEND_SECONDS:-60}
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5001
    depends_on:
      - backend

  mariadb:
    image: mariadb:10.6.20
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: cleanwash
    volumes:
      - cleanwash_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PMA_HOST: mariadb
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "127.0.0.1:8080:80"

volumes:
  # Det interne volumenavn bevares, så eksisterende lokale data fortsat kan bruges.
  cleanwash_data:
